<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jktac.com · 工作台</title>
  <meta name="description" content="jktac 工作台 · 活跃热力图 · 工作安排 · 项目进度 · 成果文件" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body data-page="show">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-chip"><img class="brand-lockup" src="/logo.png" alt="jktac.com" /></span>
      </a>
      <div class="header-actions">
        <button type="button" class="btn btn-ghost-light" id="themeToggle" title="切换暗色模式" aria-label="切换暗色模式">🌙</button>
        <a class="gh-badge" href="https://github.com/shjk0817" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          <span class="gh-handle">shjk0817</span>
        </a>
        <a class="btn btn-ghost-light" href="/manage">管理</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="stats-grid" id="statsGrid" aria-label="统计概览"></section>

    <section class="card">
      <div class="card-head">
        <div><h2>GitHub 项目</h2></div>
      </div>
      <div class="gh-grid" id="githubGrid"></div>
      <p class="empty hidden" id="githubEmpty">还没有项目卡片</p>
    </section>

    <section class="card heatmap-card">
      <div class="card-head">
        <div class="legend">
          <span>少</span>
          <i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i>
          <span>多</span>
        </div>
      </div>
      <div class="heatmap" id="heatmap"></div>
      <p class="hm-tip" id="heatmapTotal"></p>
    </section>

    <section class="card">
      <div class="card-head"><div><h2>工作安排</h2></div></div>
      <ul class="list" id="arrangeList"></ul>
      <p class="empty hidden" id="arrangeEmpty">还没有安排</p>
    </section>

    <section class="card">
      <div class="card-head"><div><h2>项目目标与进度</h2></div></div>
      <div class="projects" id="projectsGrid"></div>
      <p class="empty hidden" id="projectsEmpty">还没有项目</p>
    </section>

    <section class="card">
      <div class="card-head"><div><h2>成果文件</h2></div></div>
      <ul class="list files-list" id="filesList"></ul>
      <p class="empty hidden" id="filesEmpty">还没有成果文件</p>
    </section>
  </main>

  <script src="/js/app.js" defer></script>
</body>
</html>
